[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relaibotix"
version = "0.1.0"
description = "RelAIBotiX"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Philipp"}]

dependencies = []

[project.optional-dependencies]
full = [
  "numpy","pandas","matplotlib","scipy","h5py","networkx","torch",
  "torchmetrics","pytorch-lightning","tensorboard","tensorboardx",
  "scikit-learn","seaborn","tqdm","omegaconf","hydra-core","pyyaml","fpdf",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
relaibotix = "relaibotix.handler:_cli_relaibotix"
relaibotix_faulty = "relaibotix.handler:_cli_faulty_evaluation_relaibotix"
relaibotix_skill_detector = "relaibotix.handler:_cli_skill_detector"
