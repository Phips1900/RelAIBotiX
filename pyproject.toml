[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relaibotix"
version = "0.1.0"
description = "Skill-resolved reliability analysis for AI-controlled robotic systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Philipp Grimmeisen"}]
license = {file = "LICENSE"}
keywords = ["robotics", "reliability", "fault-tree", "dtmc", "prism", "storm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "h5py>=3.10",
  "jsonpickle>=3.0",
  "networkx>=3.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
skill-detection = [
  "relaibotix-skill-detector @ git+https://github.com/Phips1900/relaibotix-skill-detector.git@4037d79",
]
reporting = [
  "fpdf2>=2.7",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]
gui = [
  "matplotlib>=3.8",
  "PySide6>=6.7",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/relaibotix/configs/robots" = ["configs/robots/*.json"]
"share/relaibotix/configs/experiments" = ["configs/experiments/*.json"]

[tool.setuptools.package-data]
"relaibotix.skilldetector" = ["checkpoints.json"]

[project.scripts]
relaibotix = "relaibotix.cli:main"

[project.urls]
Homepage = "https://github.com/Phips1900/RelAIBotiX"
Repository = "https://github.com/Phips1900/RelAIBotiX"
Issues = "https://github.com/Phips1900/RelAIBotiX/issues"
