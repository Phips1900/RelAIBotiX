[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relaibotix"
version = "0.1.0"
description = "RelAIBotiX"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Philipp"}]

dependencies = [
  "h5py>=3.10",
  "jsonpickle>=3.0",
  "networkx>=3.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
skill-detection = [
  "relaibotix-skill-detector @ git+https://github.com/Phips1900/relaibotix-skill-detector.git@4037d79",
]
reporting = [
  "fpdf2>=2.7",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]
gui = [
  "PySide6>=6.7",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/relaibotix/configs/robots" = ["configs/robots/*.json"]
"share/relaibotix/configs/experiments" = ["configs/experiments/*.json"]

[tool.setuptools.package-data]
"relaibotix.skilldetector" = ["checkpoints.json"]

[project.scripts]
relaibotix = "relaibotix.cli:main"
